# RLVR run: Qwen3-1.7B base, 5000 hotpot examples, single GPU.
# Same recipe as RLCR-5000-ng16-longcomp.yaml (max_prompt_length=2048, max_completion_length=1280,
# num_generations=16, vllm_gpu_memory_utilization=0.2, lr/scheduler/warmup) so it's directly
# comparable -- the only differences are RLVR's simpler think+answer format (no confidence/analysis
# tags) and accuracy-only reward (no Brier/calibration terms), matching the same RLVR vs RLCR
# distinction used everywhere else in this repo (e.g. configs/Qwen-1.7B/math/RLVR-5000-ng32.yaml vs
# RLCR-5000-ng32.yaml).

# Model arguments
model_name_or_path: Qwen/Qwen3-1.7B
run_name: "RLVR-qwen3-1.7B-hotpot5000-ng16-longcomp"
output_dir: data/RLVR-qwen3-1.7B-hotpot5000-ng16-longcomp
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: mehuldamani/hotpot_qa
train_subset_size: 5000
num_processes: 1

# GRPO trainer config
bf16: true
beta: 0.0
eval_strategy: "no"
eval_on_start: false
format_pattern: "ta"
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_strategy: "end"
learning_rate: 1e-06
log_level: info
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: constant_with_warmup
mask_truncated_completions: false
max_prompt_length: 2048
max_completion_length: 1280
max_steps: -1
num_generations: 16
num_iterations: 1
num_train_epochs: 1
optim: adamw_bnb_8bit
overwrite_output_dir: true
per_device_train_batch_size: 1
push_to_hub: false
report_to: []
reward_funcs: ["format","accuracy"]
reward_weights: [0.5,0.5]
save_strategy: "steps"
save_steps: 250
save_total_limit: 1
scale_rewards: false
seed: 43
sys_prompt_name: "gen"
temperature: 0.7
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.2
warmup_ratio: 0.05
