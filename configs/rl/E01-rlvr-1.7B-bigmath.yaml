# RLVR run: Qwen3-1.7B base, 5000 big-math-digits examples, single GPU, num_generations=32.
# Same recipe as configs/Qwen-1.7B/math/RLCR-5000-ng32.yaml (random order, 1 epoch, same batch/
# optimizer/GPU settings) so it's directly comparable at this scale -- the only differences are
# RLVR's simpler think+answer format (no confidence/analysis tags) and accuracy-only reward
# (no Brier/calibration terms), matching the paper's own RLVR vs RLCR distinction
# (see configs/Qwen-7B/math/RLVR.yaml, which does the same on Qwen2.5-7B).

# Model arguments
model_name_or_path: Qwen/Qwen3-1.7B
run_name: "RLVR-qwen3-1.7B-bigmathdigits5000-ng32"
output_dir: data/RLVR-qwen3-1.7B-bigmathdigits5000-ng32
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: mehuldamani/big-math-digits
train_subset_size: 5000
num_processes: 1

# GRPO trainer config
bf16: true
beta: 0.0
eval_strategy: "no"
eval_on_start: false
format_pattern: "ta"
gradient_accumulation_steps: 32
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_strategy: "end"
learning_rate: 5e-06
log_level: info
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: linear
mask_truncated_completions: false
max_prompt_length: 768
max_completion_length: 1024
max_steps: -1
num_generations: 32
num_iterations: 1
num_train_epochs: 1
optim: adamw_bnb_8bit
overwrite_output_dir: true
per_device_train_batch_size: 1
push_to_hub: false
report_to: []
reward_funcs: ["format","accuracy"]
reward_weights: [0.5,0.5]
save_strategy: "steps"
save_steps: 250
save_total_limit: 1
scale_rewards: false
seed: 43
sys_prompt_name: "gen"
temperature: 0.7
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.25
warmup_ratio: 0.20
