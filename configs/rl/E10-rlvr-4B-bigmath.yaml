# RLVR run: Qwen3-4B (Instruct), math-only (5000 big-math-digits examples, shuffled seed=43).
# Same dataset/hyperparameters as configs/Qwen-4B/math/RLCR-5000-ng16.yaml (the working,
# stability-tuned 4B recipe: no DeepSpeed -- accelerate_single_gpu.yaml -- adamw_bnb_8bit,
# num_generations=16, batch=2/ga=16, vllm_gpu_memory_utilization=0.55), except reward_funcs drop
# to accuracy+format only (no confidence/brier), and format_pattern/sys_prompt_name switch to the
# no-confidence "ta"/"gen" variant, matching configs/Qwen-1.7B/mixed/RLVR-bigmath2500-hotpot2500.yaml.

# Model arguments
model_name_or_path: Qwen/Qwen3-4B
run_name: "RLVR-qwen3-4B-bigmathdigits5000-ng16"
output_dir: data/RLVR-qwen3-4B-bigmathdigits5000-ng16
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: data/bigmathdigits5000-flat
num_processes: 1

# GRPO trainer config
bf16: true
beta: 0.0
eval_strategy: "no"
eval_on_start: false
format_pattern: "ta"
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_strategy: "end"
learning_rate: 5e-6
log_level: info
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: linear
mask_truncated_completions: false
max_prompt_length: 768
max_completion_length: 1024
max_steps: -1
num_generations: 16
num_iterations: 1
num_train_epochs: 1
optim: adamw_bnb_8bit
overwrite_output_dir: true
per_device_train_batch_size: 2
push_to_hub: false
report_to: []
reward_funcs: ["format","accuracy"]
reward_weights: [0.5,0.5]
save_strategy: "steps"
save_steps: 250
save_total_limit: 1
scale_rewards: false
seed: 43
sys_prompt_name: "gen"
temperature: 0.7
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.55
warmup_ratio: 0.20
