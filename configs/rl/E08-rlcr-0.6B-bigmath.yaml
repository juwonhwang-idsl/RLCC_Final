# RLCR run: Qwen3-0.6B base, 5000 big-math-digits examples, single GPU.
# Same as RLCR-5000.yaml but num_generations bumped 8->32 (closer to original paper's exploration
# width) to test whether it fixes the confidence collapse-to-single-bin failure mode.
# generation_batch_size kept at 64 (was 16) by raising gradient_accumulation_steps 4->16,
# so prompts/step stays at 2 (same step count per epoch as the 8-generation run).

# Model arguments
model_name_or_path: Qwen/Qwen3-0.6B
run_name: "RLCR-qwen3-0.6B-bigmathdigits5000-ng32"
output_dir: data/RLCR-qwen3-0.6B-bigmathdigits5000-ng32
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: mehuldamani/big-math-digits
train_subset_size: 5000
num_processes: 1

# GRPO trainer config
bf16: true
beta: 0.0
eval_strategy: "no"
eval_on_start: false
format_pattern: "tabc"
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_strategy: "end"
learning_rate: 5e-06
log_level: info
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: linear
mask_truncated_completions: false
max_prompt_length: 768
max_completion_length: 1024
max_steps: -1
num_generations: 32
num_iterations: 1
num_train_epochs: 1
overwrite_output_dir: true
per_device_train_batch_size: 4
push_to_hub: false
report_to: []
reward_funcs: ["format","accuracy","brier","mean_confidence","confidence_one_or_zero"]
reward_weights: [0.5,0.5,0.5,0.00001,0.00001]
save_strategy: "steps"
save_steps: 100
save_total_limit: 1
scale_rewards: false
seed: 43
sys_prompt_name: "tabc"
temperature: 0.7
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.6
warmup_ratio: 0.20
