# RLCC for Llama-3.2-3B: same setup as RLCR-5000-ng16-lora.yaml (starts fresh from
# meta-llama/Llama-3.2-3B-Instruct, same LoRA/hyperparameters/reward composition), except the
# training rows are pre-sorted into a curriculum by build_rlcc_dataset.py using the confidence
# values from the RLCR (no-SFT) checkpoint's trainset predictions
# (eval_outputs/llama32-3b-rlcr-nosft-trainset-conf-5000, sorted via scripts/build_rlcc_dataset.py,
# seed=0, num_groups=3, into persist/rlcc-llama32-3b-bigmathdigits5000-n3/combined).
#
# Training weights start from base Instruct, NOT from the RLCR checkpoint -- warm-starting from
# RLCR would confound any RLCC effect with "extra gradient steps on top of an already-trained
# model," exactly the bug found and fixed for Phi-4-mini's RLCC runs earlier this session.
#
# shuffle_dataset explicitly set to false: GRPOConfig defaults this to True, and the trainer's
# RepeatSampler runs torch.randperm on top of the pre-sorted dataset otherwise, erasing the
# within-batch confidence homogeneity RLCC depends on.

# Model arguments
model_name_or_path: meta-llama/Llama-3.2-3B-Instruct
run_name: "RLCC-llama32-3B-bigmathdigits5000-n3-from-instruct"
output_dir: persist/RLCC-llama32-3B-bigmathdigits5000-n3-from-instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

# Data training arguments
dataset_name: mehuldamani/big-math-digits
rlcc_preordered_dataset_path: persist/rlcc-llama32-3b-bigmathdigits5000-n3/combined
train_subset_size: 5000
num_processes: 2

# GRPO trainer config
bf16: true
beta: 0.0
eval_strategy: "no"
eval_on_start: false
format_pattern: "tabc"
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_strategy: "end"
learning_rate: 5e-06
log_level: info
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: linear
mask_truncated_completions: false
max_prompt_length: 768
max_completion_length: 1024
max_steps: -1
num_generations: 16
num_iterations: 1
num_train_epochs: 1
optim: adamw_bnb_8bit
overwrite_output_dir: true
per_device_train_batch_size: 1
push_to_hub: false
report_to: []
reward_funcs: ["format","accuracy","brier","mean_confidence","confidence_one_or_zero"]
reward_weights: [0.5,0.5,0.5,0.00001,0.00001]
save_strategy: "steps"
save_steps: 250
save_total_limit: 1
scale_rewards: false
seed: 43
shuffle_dataset: false
sys_prompt_name: "tabc"
temperature: 0.7
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.3
warmup_ratio: 0.20
