# RLCC-ascending run: Qwen3-0.6B, big-math-digits, single GPU.
# Same as RLCC-n3-from-ng32ckpt.yaml except each of the 3 shuffled groups is sorted ASCENDING by
# confidence (hardest first) instead of descending -- the anti-curriculum ablation arm. See that
# config's header for the per_device_train_batch_size/vllm_gpu_memory_utilization OOM-avoidance
# rationale (identical here) and scripts/build_rlcc_dataset.py --ascending for how the order was
# built (seed=0, num_groups=3).

# Model arguments
model_name_or_path: data/RLCR-qwen3-0.6B-bigmathdigits5000-ng32
run_name: "RLCC-ascending-qwen3-0.6B-bigmathdigits5000-n3-from-ng32ckpt"
output_dir: persist/RLCC-ascending-qwen3-0.6B-bigmathdigits5000-n3-from-ng32ckpt
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: mehuldamani/big-math-digits
rlcc_preordered_dataset_path: persist/rlcc-ascending-bigmathdigits-qwen3-0p6B-ng32ckpt-n3/combined
train_subset_size: 5000
num_processes: 1

# GRPO trainer config
bf16: true
beta: 0.0
eval_strategy: "no"
eval_on_start: false
format_pattern: "tabc"
gradient_accumulation_steps: 64
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_strategy: "end"
learning_rate: 5e-06
log_level: info
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: linear
mask_truncated_completions: false
max_prompt_length: 768
max_completion_length: 1024
max_steps: -1
num_generations: 32
num_iterations: 1
num_train_epochs: 1
overwrite_output_dir: true
per_device_train_batch_size: 1
push_to_hub: false
report_to: []
reward_funcs: ["format","accuracy","brier","mean_confidence","confidence_one_or_zero"]
reward_weights: [0.5,0.5,0.5,0.00001,0.00001]
save_strategy: "steps"
save_steps: 100
save_total_limit: 1
scale_rewards: false
seed: 43
shuffle_dataset: false
sys_prompt_name: "tabc"
temperature: 0.7
use_vllm: true
vllm_device: auto
vllm_gpu_memory_utilization: 0.4
warmup_ratio: 0.20
